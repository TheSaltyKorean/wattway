# Deploy:  cd worker/plan-counter && npx wrangler deploy
#
# Serves wattway.net/api/plan, which GitHub Pages does not serve — the route
# takes precedence at Cloudflare's edge, so it never conflicts with the static
# site. Free at WattWay's volume: the Workers free tier is 100k requests/day
# against roughly ten plans a day.
#
# Intentionally has NO bindings. Plans are counted from Worker invocation
# metrics, so there is no dataset, no storage, and nothing to enable — an
# earlier Analytics Engine version could not be deployed (API error 10089).

name = "wattway-plan-counter"
main = "src/index.js"
compatibility_date = "2026-08-02"
account_id = "0ba59b722ee12e7de05492f5db5c1c71"

# Bound to the apex only. The site has no other hostname (public/CNAME).
routes = [
  { pattern = "wattway.net/api/plan", zone_name = "wattway.net" }
]
